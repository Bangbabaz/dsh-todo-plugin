name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The release job only runs Node tests; the Chromium download is unnecessary.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const fs = require('fs'); const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version; const tag = process.env.TAG.replace(/^v/, ''); if (tag !== version) { console.error('tag ' + process.env.TAG + ' does not match package.json version ' + version); process.exit(1); }"

      - name: Pack
        run: npm pack

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(./*.tgz)
          if [ ${#tarballs[@]} -eq 0 ]; then
            echo 'no tarball produced' >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${tarballs[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${tarballs[@]}" --generate-notes
          fi
